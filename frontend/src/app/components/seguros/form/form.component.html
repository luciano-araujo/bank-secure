<div class="container" id="seguro-form-container">
    <div class="form-card" id="seguro-form-card">
        <h1 id="form-title">{{ isEditMode ? 'Editar Seguro' : 'Novo Seguro' }}</h1>

        @if (errorMessage) {
        <div class="error-message" id="error-message">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="onSubmit()" #seguroForm="ngForm" id="seguro-form">
            <div class="form-group" id="titulo-group">
                <label for="titulo-input">Título</label>
                <input type="text" id="titulo-input" name="titulo" [(ngModel)]="seguro.titulo" required
                    placeholder="Ex: Seguro Auto" />
            </div>

            <div class="form-group" id="cobertura-group">
                <label for="cobertura-input">Cobertura Mínima</label>
                <input type="text" id="cobertura-input" name="coberturaMinima" [(ngModel)]="seguro.coberturaMinima"
                    required placeholder="Ex: 50000 ou Completa" />
            </div>

            <div class="form-group" id="premio-group">
                <label for="premio-input">Valor Prêmio Base (R$)</label>
                <input type="number" id="premio-input" name="valorPremioBase" [(ngModel)]="seguro.valorPremioBase"
                    required min="0" step="0.01" placeholder="0.00" />
            </div>

            <div class="form-actions" id="form-actions">
                <button type="submit" id="salvar-btn" class="btn btn-primary" [disabled]="loading || !seguroForm.valid">
                    {{ loading ? 'Salvando...' : 'Salvar' }}
                </button>
                <button type="button" id="cancelar-btn" class="btn btn-secondary" (click)="cancelar()">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
