<div class="container" id="cliente-form-container">
    <div class="form-card" id="cliente-form-card">
        <h1 id="form-title">{{ isEditMode ? 'Editar Cliente' : 'Novo Cliente' }}</h1>

        @if (errorMessage) {
        <div class="error-message" id="error-message">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="onSubmit()" #clienteForm="ngForm" id="cliente-form">
            <div class="form-group" id="nome-group">
                <label for="nome-input">Nome</label>
                <input type="text" id="nome-input" name="nome" [(ngModel)]="cliente.nome" required />
            </div>

            <div class="form-group" id="cpf-group">
                <label for="cpf-input">CPF</label>
                <input type="text" id="cpf-input" name="cpf" [(ngModel)]="cliente.cpf" (input)="formatCPF($event)"
                    maxlength="14" placeholder="000.000.000-00" required />
                <small class="form-hint">Exemplo: 123.456.789-00</small>
            </div>

            <div class="form-group" id="email-group">
                <label for="email-input">Email</label>
                <input type="email" id="email-input" name="email" [(ngModel)]="cliente.email" required />
            </div>

            <div class="form-group" id="senha-group">
                <label for="senha-input">Senha</label>
                <input type="password" id="senha-input" name="senha" [(ngModel)]="cliente.senha" required />
            </div>

            <div class="form-group" id="telefone-group">
                <label for="telefone-input">Telefone</label>
                <input type="text" id="telefone-input" name="telefone" [(ngModel)]="cliente.telefone"
                    (input)="formatTelefone($event)" maxlength="13" placeholder="00 00000-0000" required />
                <small class="form-hint">Exemplo: 11 96888-2222</small>
            </div>

            <div class="form-group" id="dataNascimento-group">
                <label for="dataNascimento-input">Data de Nascimento</label>
                <input type="date" id="dataNascimento-input" name="dataNascimento" [(ngModel)]="cliente.dataNascimento"
                    required />
            </div>

            <div class="form-actions" id="form-actions">
                <button type="submit" id="salvar-btn" class="btn btn-primary"
                    [disabled]="loading || !clienteForm.valid">
                    {{ loading ? 'Salvando...' : 'Salvar' }}
                </button>
                <button type="button" id="cancelar-btn" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
            </div>
        </form>
    </div>
</div>
