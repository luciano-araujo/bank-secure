<div class="login-container" id="login-container">
    <div class="login-card" id="login-card">
        <div class="logo-section" id="logo-section">
            <h1 id="app-title">Bank Secure</h1>
            <p id="app-subtitle">Sistema de Seguros</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" id="login-form">
            <div class="form-group" id="email-group">
                <label for="email-input">Email</label>
                <input type="email" id="email-input" name="email" [(ngModel)]="credentials.email"
                    placeholder="seu@email.com" required />
            </div>

            <div class="form-group" id="senha-group">
                <label for="senha-input">Senha</label>
                <input type="password" id="senha-input" name="senha" [(ngModel)]="credentials.senha"
                    placeholder="Digite sua senha" required />
            </div>

            @if (errorMessage) {
            <div class="error-message" id="error-message">{{ errorMessage }}</div>
            }

            <button type="submit" id="login-submit-btn" class="btn btn-primary"
                [disabled]="loading || !loginForm.valid">
                {{ loading ? 'Entrando...' : 'Entrar' }}
            </button>

            <button type="button" id="anonimo-btn" class="btn btn-secondary" (click)="acessarComoAnonimo()">
                Acessar como Anônimo
            </button>
        </form>
    </div>
</div>
