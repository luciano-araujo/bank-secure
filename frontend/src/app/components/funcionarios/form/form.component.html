<div class="container" id="funcionario-form-container">
    <div class="form-card" id="funcionario-form-card">
        <h1 id="form-title">{{ isEditMode ? 'Editar Funcionário' : 'Novo Funcionário' }}</h1>

        @if (errorMessage) {
        <div class="error-message" id="error-message">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="onSubmit()" #funcionarioForm="ngForm" id="funcionario-form">
            <div class="form-group" id="nome-group">
                <label for="nome-input">Nome</label>
                <input type="text" id="nome-input" name="nome" [(ngModel)]="funcionario.nome" required />
            </div>

            <div class="form-group" id="cpf-group">
                <label for="cpf-input">CPF</label>
                <input type="text" id="cpf-input" name="cpf" [(ngModel)]="funcionario.cpf" (input)="formatCPF($event)"
                    maxlength="14" placeholder="000.000.000-00" required />
                <small class="form-hint">Exemplo: 123.456.789-00</small>
            </div>

            <div class="form-group" id="email-group">
                <label for="email-input">Email</label>
                <input type="email" id="email-input" name="email" [(ngModel)]="funcionario.email" required />
            </div>

            <div class="form-group" id="senha-group">
                <label for="senha-input">Senha</label>
                <input type="password" id="senha-input" name="senha" [(ngModel)]="funcionario.senha" required />
            </div>

            <div class="form-group" id="telefone-group">
                <label for="telefone-input">Telefone</label>
                <input type="text" id="telefone-input" name="telefone" [(ngModel)]="funcionario.telefone" maxlength="15"
                    placeholder="(11) 91234-5678" required />
                <small class="form-hint">Exemplo: (11) 91234-5678</small>
            </div>

            <div class="form-group" id="dataNascimento-group">
                <label for="dataNascimento-input">Data de Nascimento</label>
                <input type="date" id="dataNascimento-input" name="dataNascimento"
                    [(ngModel)]="funcionario.dataNascimento" required />
            </div>

            <div class="form-actions" id="form-actions">
                <button type="submit" id="salvar-btn" class="btn btn-primary"
                    [disabled]="loading || !funcionarioForm.valid">
                    {{ loading ? 'Salvando...' : 'Salvar' }}
                </button>
                <button type="button" id="cancelar-btn" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
            </div>
        </form>
    </div>
</div>
